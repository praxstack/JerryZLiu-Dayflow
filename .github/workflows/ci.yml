name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# macOS-only verification baseline (plan 001). Do not add an ubuntu xcodebuild
# job here — Darwin-only app sources would go red. Linux `swift test` for
# dayflow-cli lives on the CLI test-suite workflow:
#   .github/workflows/cli.yml  (PR #7, branch prax/cli-test-suite-6fc7)
#
# Dayflow.xcodeproj is objectVersion 77 (Xcode 16+; LastUpgradeCheck 1620).
# macos-14 defaults to Xcode 15.4, which cannot open that format.

jobs:
  unit-tests:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Run DayflowTests
        run: |
          xcodebuild test \
            -project Dayflow/Dayflow.xcodeproj \
            -scheme Dayflow \
            -destination 'platform=macOS' \
            -only-testing:DayflowTests \
            -resultBundlePath TestResults
      - name: Build dayflow-cli
        run: cd tools/dayflow-cli && swift build
